# Disposable local cache policy. Authentication disabled only on loopback.
version = 1

[server]
bind = "127.0.0.1:8080"
max_request_body_bytes = 65536
max_in_flight_requests = 64
request_timeout_seconds = 5

[storage]
data_dir = "./data"
cleanup_interval_seconds = 1
cleanup_batch_entries = 500

[auth]
mode = "disabled"

[[namespaces]]
name = "cache"
mode = "memory"

[namespaces.retention]
require_ttl = true
default_ttl_seconds = 300
max_ttl_seconds = 3600

[namespaces.admission]
value_kind = "bytes"
max_key_bytes = 256
max_value_bytes = 65536

[namespaces.capacity]
max_entries = 10000
max_total_bytes = 67108864 # 64 MiB of key + value bytes
on_full = "evict_oldest"
