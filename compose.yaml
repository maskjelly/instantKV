services:
  instantkv:
    build:
      context: .
      args:
        BUILD_SOURCE: ${INSTANTKV_BUILD_SOURCE:-source-build}
    image: instantkv:local
    command: ["serve", "--bind", "0.0.0.0:8080"]
    ports:
      - "127.0.0.1:${INSTANTKV_PORT:-8080}:8080"
    volumes:
      - memory:/state
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

volumes:
  memory:
