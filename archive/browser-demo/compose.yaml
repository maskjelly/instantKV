name: instantkv-demo
services:
  tunnel:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: ["tunnel", "--no-autoupdate", "--protocol", "quic", "run", "--token-file", "/run/secrets/tunnel-token"]
    network_mode: host
    user: "65532:65532"
    volumes:
      - ./.tunnel-token:/run/secrets/tunnel-token:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
  memory:
    image: ${INSTANTKV_DEMO_IMAGE:-instantkv:local}
    command: ["serve", "--config", "/config/instantkv.toml"]
    env_file: .env
    volumes:
      - ./instantkv.toml:/config/instantkv.toml:ro
      - memory:/state
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      disable: true
  gateway:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: "1000:1000"
    command: ["node", "/app/gateway.mjs"]
    env_file: .env
    environment:
      INSTANTKV_DEMO_BACKEND: http://memory:8080
    volumes:
      - ./gateway.mjs:/app/gateway.mjs:ro
      - ./fixtures.mjs:/app/fixtures.mjs:ro
    ports:
      - "127.0.0.1:8098:8098"
    depends_on: [memory]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
volumes:
  memory:
