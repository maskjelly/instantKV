name: Feature proposal
description: Tell us what your agent or deployment needs to do.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What cannot be done with the current keys, checkpoints and tools?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should change, and how could we check it?
    validations:
      required: true
