name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable build --workspace --release --locked
      - run: cargo +stable run -p instantkv --locked -- check-config --config config/instantkv.example.toml
      - run: cargo +stable run -p instantkv --locked -- check-config --config config/local-cache.toml
