name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust tools
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt --component clippy
      - name: Set up offline evaluation tests
        run: |
          python3 -m venv "$RUNNER_TEMP/instantkv-eval-tests"
          "$RUNNER_TEMP/instantkv-eval-tests/bin/python" -m pip install -r eval/requirements-offline.txt
      - name: Verify repository and core
        env:
          RUSTUP_TOOLCHAIN: '1.98'
        run: INSTANTKV_TEST_PYTHON="$RUNNER_TEMP/instantkv-eval-tests/bin/python" ./scripts/check.sh --core
      - name: Build portable Linux binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          case "$(uname -m)" in
            x86_64) target=x86_64-unknown-linux-musl ;;
            aarch64) target=aarch64-unknown-linux-musl ;;
          esac
          rustup target add --toolchain 1.98 "$target"
          CC=musl-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc cargo +1.98 build --release --locked --target "$target" -p instantkv
          ./target/"$target"/release/instantkv demo
          ./target/"$target"/release/instantkv demo --swarm
      - name: Verify local profile and record footprint
        run: python3 scripts/local-smoke.py --records 100 --output dist/local-footprint-${{ runner.arch }}.json
      - name: Verify indexed memory recovery
        run: python3 scripts/memory-bench.py --records 100 --runs 1 --queries 10 --output dist/memory-smoke-${{ runner.arch }}.json
      - name: Package verified binary
        run: |
          bash scripts/package-release.sh
          python3 scripts/test-package-release.py dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instantkv-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  container:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: instantkv-Linux-X64
          path: dist
      - name: Container quick-start and restart demo
        run: |
          tar -xzf dist/instantkv-linux-x86_64.tar.gz -C dist instantkv
          printf 'INSTANTKV_PORT=8095\n' > .env
          INSTANTKV_BUILD_SOURCE=prebuilt ./scripts/quickstart.sh | tee /tmp/instantkv-setup.log
          grep -Fq 'Ready at http://127.0.0.1:8095' /tmp/instantkv-setup.log
          ./scripts/kv.sh demo
          ./scripts/kv.sh demo --swarm
          ./scripts/kv.sh put knowledge ci/probe --value '{"retained":true}'
          docker compose restart instantkv
          docker compose up -d --wait
          ./scripts/kv.sh get knowledge ci/probe
          ./scripts/kv.sh checkpoint < examples/checkpoint.json
          ./scripts/backup.sh /tmp/instantkv-backup
          ./scripts/restore-drill.sh /tmp/instantkv-backup first-checkpoint
          export COMPOSE_PROJECT_NAME=instantkv-swarm INSTANTKV_PROFILE=swarm INSTANTKV_PORT=8096
          INSTANTKV_BUILD_SOURCE=prebuilt ./scripts/quickstart.sh
          ./scripts/kv.sh put shared ci/shared --value '{"baseline":true}'
          ./scripts/kv.sh checkpoint --namespace alpha_checkpoints < examples/swarm-checkpoint.json
          ./scripts/kv.sh restore --namespace alpha_checkpoints --agent alpha --session run-1
          ./scripts/backup.sh /tmp/instantkv-swarm-backup
          ./scripts/restore-drill.sh /tmp/instantkv-swarm-backup alpha-first-handoff alpha_checkpoints
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify retained historical tools
        run: node --test archive/browser-demo/gateway.test.mjs archive/browser-demo/replay-data.test.mjs
