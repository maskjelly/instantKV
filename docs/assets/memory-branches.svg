<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
 <title id="title">Memory branches and continuous shared updates — proposal</title>
 <desc id="desc">A retained historical snapshot seeds independent private branches. Agents submit findings during runs to review. Accepted facts update canonical shared knowledge. An ordered durable feed returns updates to every authorized agent; offline agents replay from a cursor.</desc>
 <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eaf0f8"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2359a6"/></marker></defs>
 <rect width="1100" height="470" fill="#ffffff"/><rect width="1100" height="470" fill="url(#grid)"/>
 <g font-family="monospace" fill="#18304c"><text x="32" y="38" font-size="21">FORK A PAST MEMORY. KEEP THE TEAM IN SYNC.</text><text x="32" y="63" font-size="12" fill="#4a5e75">PROPOSAL / NOT IMPLEMENTED · Private branches · Reviewed facts · Resumable updates</text></g>
 <g fill="#ffffff" stroke="#2359a6"><rect x="32" y="135" width="215" height="180"/><rect x="310" y="105" width="210" height="100"/><rect x="310" y="245" width="210" height="100"/><rect x="590" y="155" width="195" height="140"/><rect x="850" y="135" width="218" height="180"/></g>
 <g fill="#2359a6" font-family="monospace" font-size="16"><text x="48" y="162">SNAPSHOT HISTORY</text><text x="326" y="133">AGENT A / BRANCH A</text><text x="326" y="273">AGENT B / BRANCH B</text><text x="607" y="183">REVIEW + MERGE</text><text x="866" y="162">SHARED KNOWLEDGE</text></g>
 <g fill="#4a5e75" font-family="monospace" font-size="12"><text x="48" y="195">Choose snapshot 1, 2, 3…</text><text x="48" y="220">Immutable source + hashes</text><text x="48" y="245">Authorized fork + lineage</text><text x="48" y="285">Same or different parents</text><text x="326" y="160">Private notes / own task</text><text x="326" y="183">Pinned base + updates</text><text x="326" y="300">Independent direction</text><text x="326" y="323">Findings + final flush</text><text x="607" y="213">Sources / permissions</text><text x="607" y="237">Dedup / conflict review</text><text x="607" y="273">Durable publication jobs</text><text x="866" y="195">Accepted facts + revisions</text><text x="866" y="220">New immutable snapshots</text><text x="866" y="245">Ordered durable event log</text><text x="866" y="285">Scoped peer task status</text></g>
 <g fill="none" stroke="#2359a6" stroke-width="1.5" marker-end="url(#arrow)"><path d="M247 210H275V155H310"/><path d="M247 240H275V295H310"/><path d="M520 155H552V203H590"/><path d="M520 295H552V248H590"/><path d="M785 225H850"/><path d="M959 315V385H415V345"/><path d="M570 385H284V205H310"/></g>
 <g fill="#4a5e75" font-family="monospace" font-size="12"><text x="620" y="373">ACCEPTED UPDATES → EVERY AUTHORIZED BRANCH</text><text x="32" y="436">Save cursor → disconnect → replay. Keep private work. Expired cursor → fresh snapshot. Stale peers stay visible.</text></g>
</svg>
