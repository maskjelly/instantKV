[workspace]
members = ["crates/instantkv-core", "crates/instantkv"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
repository = "https://github.com/maskjelly/instantKV"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
instantkv-core = { path = "crates/instantkv-core" }
serde_json = "1"
redb = "4"
thiserror = "2"
tempfile = "3"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-std", "io-util", "process"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
